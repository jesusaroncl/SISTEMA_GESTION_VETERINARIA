# Producción en servidor físico con Docker + Nginx Proxy Manager
# Uso: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Nginx Proxy Manager (en el mismo servidor o en la red):
#   - Frontend  →  http://IP_DEL_SERVIDOR:7000
#   - Backend   →  http://IP_DEL_SERVIDOR:9000
#
# NEXT_PUBLIC_API_BASE_URL debe ser la URL pública HTTPS del backend (ver .env.example)

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FLASK_APP: app
      USE_GUNICORN: "true"
    volumes:
      - uploads_data:/usr/src/app/uploads
    ports:
      - "${BACKEND_PORT:-9000}:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: always
    ports:
      - "${FRONTEND_PORT:-7000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
